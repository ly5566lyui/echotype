<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- WeType-Linux app icon: keyboard + voice waveform, Nord palette -->
  <!-- Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#2E3440" stroke="#4C566A" stroke-width="2"/>
  <!-- Keyboard keys (top) -->
  <g fill="#88C0D0">
    <circle cx="18" cy="20" r="2.6"/>
    <circle cx="28" cy="20" r="2.6"/>
    <circle cx="38" cy="20" r="2.6"/>
    <circle cx="48" cy="20" r="2.6"/>
    <circle cx="23" cy="29" r="2.6"/>
    <circle cx="33" cy="29" r="2.6"/>
    <circle cx="43" cy="29" r="2.6"/>
  </g>
  <rect x="18" y="35" width="30" height="4" rx="2" fill="#88C0D0"/>
  <!-- Voice waveform (bottom) -->
  <g stroke="#81A1C1" stroke-width="3" stroke-linecap="round">
    <line x1="18" y1="50" x2="18" y2="52"/>
    <line x1="26" y1="47" x2="26" y2="55"/>
    <line x1="34" y1="45" x2="34" y2="57"/>
    <line x1="42" y1="47" x2="42" y2="55"/>
    <line x1="50" y1="50" x2="50" y2="52"/>
  </g>
</svg>
