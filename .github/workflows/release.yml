name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Build Debian package
        run: cargo deb

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="echotype-linux-${GITHUB_REF_NAME}"
          mkdir -p "$DIR"
          cp target/release/echotype-linux "$DIR/"
          cp config.example.toml README.md "$DIR/"
          cp -r themes scripts systemd "$DIR/"
          tar -czf "echotype-linux-${VERSION}-linux-x86_64.tar.gz" "$DIR"
          sha256sum "echotype-linux-${VERSION}-linux-x86_64.tar.gz" > "echotype-linux-${VERSION}-linux-x86_64.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_FILE=$(ls target/debian/*.deb | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --title "EchoType-Linux v${VERSION}" \
            --generate-notes \
            "echotype-linux-${VERSION}-linux-x86_64.tar.gz" \
            "echotype-linux-${VERSION}-linux-x86_64.tar.gz.sha256" \
            "$DEB_FILE"
