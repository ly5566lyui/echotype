[package]
name = "wetype-linux"
version = "0.3.0"
edition = "2021"
authors = ["WeType-Linux Contributors"]
description = "A modern input method enhancement daemon for Linux (Fcitx5), featuring voice-to-text, cross-device clipboard sync, and quick phrases."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ly5566lyui/-wetype-"
keywords = ["ime", "fcitx5", "speech-to-text", "clipboard", "linux"]
categories = ["command-line-utilities", "internationalization"]

[dependencies]
# Async Runtime & Core Utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "fs"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "=4.5.20", features = ["derive"] }

# Configuration & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# Standard Paths (~/.config, ~/.local/share)
dirs = "5"

# Linux DBus Interop (Fcitx5 & System Services)
zbus = { version = "=4.4.0", features = ["tokio"] }

# Audio & Speech Recording
cpal = "0.15"

# Clipboard & Quick Phrases Storage
# wayland-data-control: 原生 Wayland 剪贴板读写 (缺失时仅能经 XWayland 工作)
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Global Hotkeys (X11: XGrabKey; Wayland falls back to the XDG Portal, see src/hotkey/)
global-hotkey = "0.6"

# LAN P2P Clipboard Sync (mDNS discovery + AES-256-GCM encrypted TCP)
mdns-sd = "0.11"
aes-gcm = "0.10"
sha2 = "0.10"

# DBus signal streams (Portal GlobalShortcuts)
futures-util = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
